name: Node CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Verify ESM output
        run: |
          node -e "
            import('fs').then(fs => {
              const esm = fs.readFileSync('./lib/index.js', 'utf8');
              if (!esm.includes('LdapAuthPlugin')) process.exit(1);
              if (!esm.includes('export {') && !esm.includes('export default')) process.exit(1);
              console.log('ESM bundle verified');
            });
          "

  docker:
    name: E2E — OpenLDAP
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Cypress binary
        run: pnpm cypress install

      - name: Build Docker image
        run: docker compose build verdaccio

      - name: Start services
        run: docker compose up -d

      - name: Wait for Verdaccio
        run: |
          for i in $(seq 1 30); do
            pnpm verdaccioctl ping -r http://localhost:4873 && exit 0
            sleep 2
          done
          docker compose logs verdaccio
          exit 1

      - name: Verify plugin loaded
        run: docker compose logs verdaccio 2>&1 | grep -q "ldap"

      - name: E2E - login check
        run: |
          pnpm verdaccioctl login -u testuser -p testpassword -r http://localhost:4873
          pnpm verdaccioctl whoami -r http://localhost:4873

      - name: E2E UI - Cypress
        run: pnpm e2e:ui:run
        env:
          VERDACCIO_URL: http://localhost:4873

      - name: Upload Cypress artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: cypress-artifacts
          path: |
            cypress/videos
            cypress/screenshots
          retention-days: 7

      # after Cypress on purpose: the UI detail suite opens the first package in the
      # list, and the battery leaves dozens of them behind.
      # LDAP has no user registration, so the battery gets a token instead of creating
      # its own account.
      - name: E2E - registry battery
        run: |
          TOKEN=$(curl -sf -X PUT -H 'Content-Type: application/json' \
            -d '{"name":"testuser","password":"testpassword"}' \
            http://localhost:4873/-/user/org.couchdb.user:testuser \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).token))")
          test -n "$TOKEN"
          pnpm e2e:registry --token "$TOKEN" --pm npm --pm pnpm

      - name: Verdaccio logs on failure
        if: failure()
        run: docker compose logs verdaccio

      - name: Stop services
        if: always()
        run: docker compose down -v

  docker-ad:
    name: E2E — Active Directory (Samba AD DC)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Cypress binary
        run: pnpm cypress install

      - name: Build Docker images (Samba AD DC + Verdaccio)
        run: docker compose -f docker-compose.ad.yaml build

      - name: Start Samba AD DC + Verdaccio
        run: docker compose -f docker-compose.ad.yaml up -d

      - name: Wait for Samba AD DC to be healthy
        run: |
          echo "Waiting for Samba AD DC (domain provisioning + user seeding)..."
          for i in $(seq 1 60); do
            if docker compose -f docker-compose.ad.yaml ps samba-ad --format json | grep -q '"healthy"'; then
              echo "Samba AD DC is healthy"
              break
            fi
            if [ "$i" -eq 60 ]; then
              docker compose -f docker-compose.ad.yaml logs samba-ad
              exit 1
            fi
            sleep 5
          done

      - name: Wait for Verdaccio
        run: |
          for i in $(seq 1 30); do
            pnpm verdaccioctl ping -r http://localhost:4873 && exit 0
            sleep 2
          done
          docker compose -f docker-compose.ad.yaml logs verdaccio
          exit 1

      - name: Verify plugin loaded
        run: docker compose -f docker-compose.ad.yaml logs verdaccio 2>&1 | grep -q "ldap"

      - name: Show Samba AD seed results
        run: docker compose -f docker-compose.ad.yaml logs samba-ad 2>&1 | tail -30

      - name: E2E - login with AD user (sAMAccountName + memberOf)
        run: |
          pnpm verdaccioctl login -u cfiehe -p testpassword -r http://localhost:4873
          pnpm verdaccioctl whoami -r http://localhost:4873

      - name: Verify groups resolved via AD memberOf
        run: |
          docker compose -f docker-compose.ad.yaml logs verdaccio 2>&1 | grep -i "GroupA\|GroupB"
          echo "Groups resolved from real AD memberOf attribute"

      - name: E2E UI - Cypress (AD)
        run: pnpm e2e:ui:run
        env:
          VERDACCIO_URL: http://localhost:4873
          LDAP_USER: cfiehe
          LDAP_PASSWORD: testpassword

      - name: Upload Cypress artifacts (AD)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: cypress-artifacts-ad
          path: |
            cypress/videos
            cypress/screenshots
          retention-days: 7

      # after Cypress on purpose: the UI detail suite opens the first package in the
      # list, and the battery leaves dozens of them behind.
      # LDAP has no user registration, so the battery gets a token instead of creating
      # its own account.
      - name: E2E - registry battery (AD)
        run: |
          TOKEN=$(curl -sf -X PUT -H 'Content-Type: application/json' \
            -d '{"name":"cfiehe","password":"testpassword"}' \
            http://localhost:4873/-/user/org.couchdb.user:cfiehe \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).token))")
          test -n "$TOKEN"
          pnpm e2e:registry --token "$TOKEN" --pm npm --pm pnpm

      - name: Verdaccio logs on failure (AD)
        if: failure()
        run: docker compose -f docker-compose.ad.yaml logs verdaccio

      - name: Stop AD services
        if: always()
        run: docker compose -f docker-compose.ad.yaml down -v
